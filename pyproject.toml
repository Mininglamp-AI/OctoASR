[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "octoasr"
dynamic = ["version"]
description = "本地语音转写服务，基于 MLX，针对 Apple Silicon 优化"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "fastapi>=0.100",
    "python-multipart>=0.0.5",
    "uvicorn>=0.20",
    "numpy",
    "scipy>=1.10",
    "mlx>=0.5",
    "mlx-lm",
    "mlx-audio",
    "mlx-vlm",
    "transformers",
    "huggingface_hub",
    "modelscope",
    "mininglamp-cider==0.8.0",
    "tqdm",
    "soundfile",
]

[project.scripts]
octoasr = "octoasr.cli.main:main"

[tool.setuptools.packages.find]
include = ["octoasr*"]

[tool.setuptools.package-data]
octoasr = ["web/*"]

[tool.setuptools.dynamic]
version = { attr = "octoasr.__version__" }
