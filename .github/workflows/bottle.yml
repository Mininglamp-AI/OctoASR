name: Build Homebrew Bottles

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha256: ${{ steps.source.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download source tarball and compute SHA256
        id: source
        run: |
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o source.tar.gz
          SHA256=$(sha256sum source.tar.gz | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Extract tag annotation as release notes
        id: notes
        run: |
          # Annotated-tag message body (subject + body), empty for lightweight tags.
          NOTES=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')
          if [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<__NOTES_EOF__"
              echo "$NOTES"
              echo "__NOTES_EOF__"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
          NOTES_BODY: ${{ steps.notes.outputs.body }}
        run: |
          if [ "$HAS_NOTES" = "true" ]; then
            printf '%s' "$NOTES_BODY" > release_notes.md
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "v${{ steps.version.outputs.version }}" \
              --notes-file release_notes.md \
              --draft
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "v${{ steps.version.outputs.version }}" \
              --generate-notes \
              --draft
          fi

  bottle:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: macos-15
            tag: arm64_sequoia
          - os: macos-14
            tag: arm64_sonoma
          - os: macos-26
            tag: arm64_tahoe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Tap and prepare formula
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          SOURCE_SHA256: ${{ needs.create-release.outputs.source_sha256 }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          brew tap Mininglamp-AI/tap
          FORMULA_PATH="$(brew --repo Mininglamp-AI/tap)/Formula/octoasr.rb"

          sed -i '' "s|url \".*\"|url \"https://github.com/${REPO}/archive/refs/tags/${TAG_NAME}.tar.gz\"|" "$FORMULA_PATH"
          sed -i '' "s|sha256 \"[0-9a-f]*\"|sha256 \"${SOURCE_SHA256}\"|" "$FORMULA_PATH"
          sed -i '' 's|python@3.13|python@3.12|g' "$FORMULA_PATH"
          sed -i '' 's|python3.13|python3.12|g' "$FORMULA_PATH"
          sed -i '' '/^[[:space:]]*bottle do$/,/^[[:space:]]*end$/d' "$FORMULA_PATH"
          sed -i '' "s|assert_match \"[0-9.]*\"|assert_match \"${VERSION}\"|" "$FORMULA_PATH"

          python3 - "$FORMULA_PATH" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace("docs/prompt_v3.txt", "docs/prompt.txt")

          old_prompt_block = (
              '    # The @mention judge reads its system prompt from docs/prompt.txt.\n'
              '    # docs/ is not otherwise packaged, so copy just this file next to core/.\n'
              '    (Pathname(site_packages)/"docs").mkpath\n'
              '    cp "docs/prompt.txt", "#{site_packages}/docs/prompt.txt"\n'
          )
          new_prompt_block = (
              '    # The @mention judge reads versioned prompts from docs/mention_prompts/.\n'
              '    # Keep docs/prompt.txt as a fallback for custom/unknown mention models.\n'
              '    (Pathname(site_packages)/"docs").mkpath\n'
              '    cp "docs/prompt.txt", "#{site_packages}/docs/prompt.txt"\n'
              '    cp_r "docs/mention_prompts", "#{site_packages}/docs/mention_prompts"\n'
          )
          text = text.replace(old_prompt_block, new_prompt_block)

          if "CIDER_VERSION" not in text:
              text = text.replace(
                  "class Octoasr < Formula\n",
                  'class Octoasr < Formula\n'
                  '  CIDER_VERSION = "0.8.0.post1"\n'
                  '  MLX_PACKAGES = %w[\n'
                  '    mlx==0.32.0\n'
                  '    mlx-metal==0.32.0\n'
                  '    mlx-lm==0.31.3\n'
                  '    mlx-audio==0.4.7\n'
                  '    mlx-vlm==0.6.10\n'
                  '  ].freeze\n\n',
                  1,
              )
          elif "MLX_PACKAGES" not in text:
              text = text.replace(
                  '  CIDER_VERSION = "0.8.0.post1"\n',
                  '  CIDER_VERSION = "0.8.0.post1"\n'
                  '  MLX_PACKAGES = %w[\n'
                  '    mlx==0.32.0\n'
                  '    mlx-metal==0.32.0\n'
                  '    mlx-lm==0.31.3\n'
                  '    mlx-audio==0.4.7\n'
                  '    mlx-vlm==0.6.10\n'
                  '  ].freeze\n',
                  1,
              )

          if "MLX_PACKAGES" in text and 'install", "--retries", "3", "--timeout", "120", *MLX_PACKAGES' not in text:
              text = re.sub(
                  r'(?P<line>^[ \t]*system venv/"bin/pip", "install", "--retries", "3", "--timeout", "120", buildpath\n)',
                  lambda m: m.group("line") + m.group("line").replace("buildpath", "*MLX_PACKAGES"),
                  text,
                  count=1,
                  flags=re.M,
              )

          cider_block = (
              '    if cider_supported?\n'
              '      system venv/"bin/pip", "install", "--retries", "3", "--timeout", "120", "mininglamp-cider==#{CIDER_VERSION}"\n'
              '      system venv/"bin/python3", "-m", "pip", "freeze"\n'
              '      repair_cider_rpaths(site_packages)\n'
              '      system venv/"bin/python3", "-c", "import cider.lib._cider_prim"\n'
              '    else\n'
              '      ohai "Skipping optional Cider acceleration; requires macOS 26 on Apple Silicon"\n'
              '    end\n'
          )

          old_cider_pattern = re.compile(
              r'\n(?P<indent>[ \t]*)# Cider is optional acceleration; keep OctoASR installable if it is unavailable here\.\n'
              r'(?P=indent)begin\n'
              r'(?:(?P=indent)  .*\n)*?'
              r'(?P=indent)rescue\n'
              r'(?:(?P=indent)  .*\n)*?'
              r'(?P=indent)end\n',
          )
          text = old_cider_pattern.sub("\n", text)
          text = text.replace(
              'system venv/"bin/python3", "-c", "import cider; assert cider.is_available()"',
              'system venv/"bin/python3", "-c", "import cider.lib._cider_prim"',
          )
          text = text.replace(
              "system venv/\"bin/python3\", \"-c\", \"import importlib.util; assert importlib.util.find_spec(\\'cider.lib._cider_prim\\')\"",
              'system venv/"bin/python3", "-c", "import cider.lib._cider_prim"',
          )
          text = text.replace(
              'system venv/"bin/python3", "-c", "import importlib.util; assert importlib.util.find_spec(\'cider.lib._cider_prim\')"',
              'system venv/"bin/python3", "-c", "import cider.lib._cider_prim"',
          )
          text = text.replace(
              "Skipping optional Cider acceleration; requires macOS 26 on Apple M5+",
              "Skipping optional Cider acceleration; requires macOS 26 on Apple Silicon",
          )
          text = re.sub(
              r'\n(?P<indent>[ \t]*)def cider_supported\?\n'
              r'(?P=indent)  OS\.mac\? &&\n'
              r'(?P=indent)    MacOS\.version\.to_s\.split\("\\."\)\.first\.to_i >= 26 &&\n'
              r'(?P=indent)    Hardware::CPU\.arm\? &&\n'
              r'(?P=indent)    apple_chip_generation >= 5\n'
              r'(?P=indent)end\n'
              r'\n'
              r'(?P=indent)def apple_chip_generation\n'
              r'(?:(?P=indent)  .*\n)*?'
              r'(?P=indent)end\n',
              '\n\\g<indent>def cider_supported?\n'
              '\\g<indent>  OS.mac? &&\n'
              '\\g<indent>    MacOS.version.to_s.split(".").first.to_i >= 26 &&\n'
              '\\g<indent>    Hardware::CPU.arm?\n'
              '\\g<indent>end\n',
              text,
          )
          text = re.sub(
              r'\n(?P<indent>[ \t]*)if cider_supported\?\n'
              r'(?:(?P=indent)  .*\n)*?'
              r'(?P=indent)else\n'
              r'(?:(?P=indent)  .*\n)*?'
              r'(?P=indent)end\n',
              "\n" + cider_block,
              text,
              count=1,
          )

          lines = text.splitlines(keepends=True)
          cider_at = next((i for i, line in enumerate(lines) if "if cider_supported?" in line), None)
          site_at = next((i for i, line in enumerate(lines) if "site_packages = Dir[venv/" in line), None)
          if cider_at is not None and site_at is not None and site_at > cider_at:
              site_line = lines.pop(site_at)
              cider_at = next(i for i, line in enumerate(lines) if "if cider_supported?" in line)
              if cider_at > 0 and lines[cider_at - 1].strip():
                  lines.insert(cider_at, "\n")
                  cider_at += 1
              lines.insert(cider_at, site_line)
              text = "".join(lines)

          if "cider_supported?" not in text:
              lines = text.splitlines(keepends=True)
              insert_at = next(
                  (i + 1 for i, line in enumerate(lines) if "site_packages = Dir[venv/" in line),
                  None,
              )
              if insert_at is None:
                  raise SystemExit("Could not patch formula: site_packages line not found")
              indent = lines[insert_at - 1][:len(lines[insert_at - 1]) - len(lines[insert_at - 1].lstrip())]
              insert = [
                  "\n",
                  f'{indent}if cider_supported?\n',
                  f'{indent}  system venv/"bin/pip", "install", "--retries", "3", "--timeout", "120", "mininglamp-cider==#{{CIDER_VERSION}}"\n',
                  f'{indent}  system venv/"bin/python3", "-m", "pip", "freeze"\n',
                  f'{indent}  repair_cider_rpaths(site_packages)\n',
                  f'{indent}  system venv/"bin/python3", "-c", "import cider.lib._cider_prim"\n',
                  f'{indent}else\n',
                  f'{indent}  ohai "Skipping optional Cider acceleration; requires macOS 26 on Apple Silicon"\n',
                  f'{indent}end\n',
              ]
              lines[insert_at:insert_at] = insert
              text = "".join(lines)
          if "docs/mention_prompts" not in text:
              lines = text.splitlines(keepends=True)
              insert_at = next(
                  (i for i, line in enumerate(lines) if '(bin/"octoasr").write' in line),
                  None,
              )
              if insert_at is None:
                  raise SystemExit("Could not patch formula: octoasr wrapper line not found")
              indent = lines[insert_at][:len(lines[insert_at]) - len(lines[insert_at].lstrip())]
              insert = [
                  "\n",
                  f'{indent}# The @mention judge reads versioned prompts from docs/mention_prompts/.\n',
                  f'{indent}# Keep docs/prompt.txt as a fallback for custom/unknown mention models.\n',
                  f'{indent}(Pathname(site_packages)/"docs").mkpath\n',
                  f'{indent}cp "docs/prompt.txt", "#{{site_packages}}/docs/prompt.txt"\n',
                  f'{indent}cp_r "docs/mention_prompts", "#{{site_packages}}/docs/mention_prompts"\n',
              ]
              lines[insert_at:insert_at] = insert
              text = "".join(lines)
          if "def cider_supported?" not in text:
              helper = '''

            private

            def cider_supported?
              OS.mac? &&
                MacOS.version.to_s.split(".").first.to_i >= 26 &&
                Hardware::CPU.arm?
            end

            def repair_cider_rpaths(site_packages)
              cider_lib = Pathname(site_packages)/"cider/lib"
              ["_cider_prim.cpython-312-darwin.so", "libcider_prim_lib.dylib"].each do |name|
                binary = cider_lib/name
                system "install_name_tool", "-add_rpath", "@loader_path/../../mlx/lib", binary
                system "codesign", "--force", "--sign", "-", binary
              end
            end
          '''
              text = text.rstrip().removesuffix("end").rstrip() + helper + "\n          end\n"
          elif "def repair_cider_rpaths" not in text:
              helper = '''

            def repair_cider_rpaths(site_packages)
              cider_lib = Pathname(site_packages)/"cider/lib"
              ["_cider_prim.cpython-312-darwin.so", "libcider_prim_lib.dylib"].each do |name|
                binary = cider_lib/name
                system "install_name_tool", "-add_rpath", "@loader_path/../../mlx/lib", binary
                system "codesign", "--force", "--sign", "-", binary
              end
            end
          '''
              text = text.rstrip().removesuffix("end").rstrip() + helper + "\n          end\n"
          path.write_text(text)
          PY

          echo "=== Updated formula ==="
          cat "$FORMULA_PATH"

          if grep -n 'mininglamp-cider==0.8.0"' "$FORMULA_PATH"; then
            echo "::error::Stale mininglamp-cider==0.8.0 install block remains in formula"
            exit 1
          fi
          if grep -n "Optional Cider install failed" "$FORMULA_PATH"; then
            echo "::error::Stale optional Cider rescue block remains in formula"
            exit 1
          fi

      - name: Install formula with bottle build
        run: |
          brew install --build-bottle Mininglamp-AI/tap/octoasr

      - name: Build bottle
        run: |
          brew bottle --no-rebuild --json Mininglamp-AI/tap/octoasr

      - name: Rename and get bottle info
        id: bottle_info
        run: |
          for f in octoasr--*.bottle.tar.gz; do
            NEW_NAME="${f//--/-}"
            mv "$f" "$NEW_NAME"
          done
          BOTTLE_FILE=$(ls octoasr-*.bottle.tar.gz)
          SHA256=$(shasum -a 256 "$BOTTLE_FILE" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "filename=$BOTTLE_FILE" >> "$GITHUB_OUTPUT"
          echo "Bottle: $BOTTLE_FILE (SHA256: $SHA256)"

      - name: Upload bottle to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" --clobber \
            --repo "${{ github.repository }}" \
            "${{ steps.bottle_info.outputs.filename }}"

  update-tap:
    needs: [create-release, bottle]
    runs-on: ubuntu-latest
    steps:
      - name: Download bottles and collect SHA256
        id: collect
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --pattern "*.bottle.tar.gz" \
            --dir ./bottles

          cd bottles
          for tag in arm64_sequoia arm64_sonoma arm64_tahoe; do
            FILE="octoasr-${VERSION}.${tag}.bottle.tar.gz"
            SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
            echo "${tag}_sha256=$SHA" >> "$GITHUB_OUTPUT"
            echo "${tag}: $SHA"
          done

      - name: Generate and push formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          SOURCE_SHA256: ${{ needs.create-release.outputs.source_sha256 }}
          SEQUOIA_SHA256: ${{ steps.collect.outputs.arm64_sequoia_sha256 }}
          SONOMA_SHA256: ${{ steps.collect.outputs.arm64_sonoma_sha256 }}
          TAHOE_SHA256: ${{ steps.collect.outputs.arm64_tahoe_sha256 }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Mininglamp-AI/homebrew-tap.git" tap-repo
          cd tap-repo

          cat > Formula/octoasr.rb << EOF
          class Octoasr < Formula
            CIDER_VERSION = "0.8.0.post1"
            MLX_PACKAGES = %w[
              mlx==0.32.0
              mlx-metal==0.32.0
              mlx-lm==0.31.3
              mlx-audio==0.4.7
              mlx-vlm==0.6.10
            ].freeze

            desc "Local speech-to-text service powered by MLX, optimized for Apple Silicon"
            homepage "https://github.com/Mininglamp-AI/octoasr"
            url "https://github.com/Mininglamp-AI/octoasr/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SOURCE_SHA256}"
            license "MIT"

            bottle do
              root_url "https://github.com/Mininglamp-AI/octoasr/releases/download/v${VERSION}"
              sha256 cellar: :any_skip_relocation, arm64_sequoia: "${SEQUOIA_SHA256}"
              sha256 cellar: :any_skip_relocation, arm64_sonoma: "${SONOMA_SHA256}"
              sha256 cellar: :any_skip_relocation, arm64_tahoe: "${TAHOE_SHA256}"
            end

            depends_on "ffmpeg"
            depends_on "python@3.12"
            depends_on :macos => :monterey
            depends_on :arch => :arm64

            def install
              venv = libexec/"venv"
              system Formula["python@3.12"].opt_bin/"python3.12", "-m", "venv", venv
              system venv/"bin/pip", "install", "--retries", "3", "--timeout", "120", "--upgrade", "pip"
              system venv/"bin/pip", "install", "--retries", "3", "--timeout", "120", buildpath
              system venv/"bin/pip", "install", "--retries", "3", "--timeout", "120", *MLX_PACKAGES

              site_packages = Dir[venv/"lib/python*/site-packages"].first

              if cider_supported?
                system venv/"bin/pip", "install", "--retries", "3", "--timeout", "120", "mininglamp-cider==#{CIDER_VERSION}"
                system venv/"bin/python3", "-m", "pip", "freeze"
                repair_cider_rpaths(site_packages)
                system venv/"bin/python3", "-c", "import cider.lib._cider_prim"
              else
                ohai "Skipping optional Cider acceleration; requires macOS 26 on Apple Silicon"
              end

              cp_r "core", site_packages
              cp_r "utils", site_packages
              cp "server.py", site_packages

              # The @mention judge reads versioned prompts from docs/mention_prompts/.
              # Keep docs/prompt.txt as a fallback for custom/unknown mention models.
              (Pathname(site_packages)/"docs").mkpath
              cp "docs/prompt.txt", "#{site_packages}/docs/prompt.txt"
              cp_r "docs/mention_prompts", "#{site_packages}/docs/mention_prompts"

              (bin/"octoasr").write <<~SH
                #!/bin/bash
                SCRIPT_PATH="\$0"
                if [ -L "\$0" ]; then
                    SCRIPT_PATH="\$(readlink -f "\$0" 2>/dev/null || readlink "\$0")"
                fi
                FORMULA_PREFIX="\$(cd "\$(dirname "\$SCRIPT_PATH")/.." && pwd)"
                exec "\${FORMULA_PREFIX}/libexec/venv/bin/python3" -m octoasr.cli.main "\$@"
              SH
              chmod 0755, bin/"octoasr"
            end

            def caveats
              <<~EOS
                OctoASR installed successfully!

                ASR, VAD, and Mention models will be downloaded automatically on first run (several GB).

                Quick start:
                  octoasr start              # Start service (auto-downloads models on first run)
                  octoasr transcribe a.wav   # Transcribe audio
                  octoasr model list         # List models

                Service management:
                  octoasr start / stop / restart / status

                Model storage: ~/.octoasr/models/
                Service address: http://127.0.0.1:8787
              EOS
            end

            test do
              assert_match "${VERSION}", shell_output("#{bin}/octoasr --version")
            end

            private

            def cider_supported?
              OS.mac? &&
                MacOS.version.to_s.split(".").first.to_i >= 26 &&
                Hardware::CPU.arm?
            end

            def repair_cider_rpaths(site_packages)
              cider_lib = Pathname(site_packages)/"cider/lib"
              ["_cider_prim.cpython-312-darwin.so", "libcider_prim_lib.dylib"].each do |name|
                binary = cider_lib/name
                system "install_name_tool", "-add_rpath", "@loader_path/../../mlx/lib", binary
                system "codesign", "--force", "--sign", "-", binary
              end
            end
          end
          EOF

          echo "=== Generated formula ==="
          cat Formula/octoasr.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/octoasr.rb
          git commit -m "Update octoasr to ${VERSION}"
          git push

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false
